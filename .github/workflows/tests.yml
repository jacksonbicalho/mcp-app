name: Tests

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack (fixa a versão do yarn definida em packageManager)
        run: corepack enable

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Formatação (Prettier)
        run: yarn format

      - name: Build
        run: yarn build

      - name: Testes com cobertura (aplica o ratchet de coverage.config.json)
        run: yarn test:cov

      - name: Publicar relatório de cobertura (diagnóstico em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5

      # Se lint/formatação/build/testes falharem neste PR, fecha o PR
      # automaticamente em vez de deixá-lo pendente — a intenção é forçar
      # reabertura de um PR novo já corrigido, em vez de reaproveitar este.
      - name: Fechar PR automaticamente se o CI falhou
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "❌ O CI falhou (lint, formatação, build ou testes). Fechando este PR automaticamente — corrija e abra um novo PR."
          gh pr close "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"

      # coverage.config.json/COVERAGE.md/.github/badges são atualizados
      # localmente pelo teardown do Jest quando a cobertura sobe (ver
      # scripts/coverage-teardown.ts). Quando o THRESHOLD muda de verdade
      # (não só o timestamp do COVERAGE.md), commita direto nesta branch do
      # PR — a atualização de cobertura vira parte do mesmo PR, revisada e
      # mergeada junto, em vez de um PR novo depois do merge (que exigiria
      # rodar o CI de novo sobre uma master que já "passou").
      #
      # `if: success()` de propósito: sem isso, um `if` customizado substitui
      # (não soma) o default do GitHub Actions de só rodar se os passos
      # anteriores passaram.
      #
      # Usa o PAT do dono (secret COVERAGE_RATCHET_PAT) em vez do GITHUB_TOKEN
      # padrão: um push feito com o token padrão não dispara um novo
      # `synchronize` (proteção do próprio Actions contra loop infinito), e
      # sem isso o check "test" nunca rodaria de novo pra validar esse commit.
      - name: Commitar ratchet de cobertura na própria branch do PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.COVERAGE_RATCHET_PAT }}
        run: |
          git add coverage.config.json COVERAGE.md .github/badges
          if git diff --cached --quiet -- coverage.config.json; then
            echo "Threshold de cobertura sem mudança; nada para commitar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: atualiza threshold de cobertura"

          # Ver comentário acima sobre o extraheader do checkout.
          git -c http.https://github.com/.extraheader= \
            push "https://x-access-token:${{ secrets.COVERAGE_RATCHET_PAT }}@github.com/${{ github.repository }}.git" HEAD:${{ github.event.pull_request.head.ref }}
