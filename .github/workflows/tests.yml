name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack (fixa a versão do yarn definida em packageManager)
        run: corepack enable

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Formatação (Prettier)
        run: yarn format

      - name: Build
        run: yarn build

      - name: Testes com cobertura (aplica o ratchet de coverage.config.json)
        run: yarn test:cov

      - name: Publicar relatório de cobertura (diagnóstico em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5

      # Se lint/formatação/build/testes falharem neste PR, fecha o PR
      # automaticamente em vez de deixá-lo pendente — a intenção é forçar
      # reabertura de um PR novo já corrigido, em vez de reaproveitar este.
      - name: Fechar PR automaticamente se o CI falhou
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "❌ O CI falhou (lint, formatação, build ou testes). Fechando este PR automaticamente — corrija e abra um novo PR."
          gh pr close "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"

      # coverage.config.json e COVERAGE.md são atualizados localmente pelo
      # teardown do Jest quando a cobertura sobe (ver scripts/coverage-teardown.ts).
      # master não aceita push direto (nem de admin) — então esse passo abre um
      # PR com a atualização, em vez de commitar direto. Só dispara quando o
      # THRESHOLD (coverage.config.json) muda de verdade, não a cada run —
      # senão o timestamp do COVERAGE.md sozinho abriria um PR por push.
      #
      # Usa o PAT do dono do repo (secret COVERAGE_RATCHET_PAT), não o
      # GITHUB_TOKEN padrão: um PR aberto com o GITHUB_TOKEN padrão não
      # dispara outros workflows (proteção contra loop infinito do próprio
      # GitHub Actions), então o check "test" nunca rodaria nesse PR.
      - name: Abrir PR com ratchet de cobertura atualizado
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.COVERAGE_RATCHET_PAT }}
        run: |
          git add coverage.config.json COVERAGE.md .github/badges
          if git diff --cached --quiet -- coverage.config.json; then
            echo "Threshold de cobertura sem mudança; nada para commitar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/coverage-ratchet-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "chore: atualiza threshold de cobertura"

          # Ver comentário acima sobre o extraheader do checkout.
          git -c http.https://github.com/.extraheader= \
            push "https://x-access-token:${{ secrets.COVERAGE_RATCHET_PAT }}@github.com/${{ github.repository }}.git" "$BRANCH"

          gh pr create --repo "${{ github.repository }}" \
            --base master --head "$BRANCH" \
            --title "chore: atualiza threshold de cobertura" \
            --body "Atualização automática de \`coverage.config.json\`/\`COVERAGE.md\` gerada por \`yarn test:cov\` após ${{ github.sha }}."
